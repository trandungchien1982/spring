spring:
  application:
    name: payment-service
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: [health, info]

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{trace_id}, spanId=%X{span_id}] [%thread] %logger{36} - TDC - PaymentService - %msg%n"