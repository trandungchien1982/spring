# Docker Compose for BarCodes
version: '3.1'
 
services:

  java-barcodes-service:
    image: tdchien1982/spring:barcodes-1.1
    restart: always
    environment:
      APP_PORT: 9091
    ports:
      - "9091:9091"
    networks:
      - common-network
networks:
    common-network:
      external: true
