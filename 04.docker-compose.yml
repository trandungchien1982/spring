# Docker Compose for RabbitMQ Retry
version: '3.1'
 
services:

  java-rabbitmq-retry-service:
    image: tdchien1982/spring:rabbitmq-retry-1.0
    restart: always
    environment:
      APP_PORT: 9091
    ports:
      - "9091:9091"
    networks:
      - common-network
networks:
    common-network:
      external: true
