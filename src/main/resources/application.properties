spring.application.name=rabbitmq-retry

server.port=${APP_PORT:9191}

# RabbitMQ connection (Spring Boot AMQP auto-configuration)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PWD:admin}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

app.rabbitmq.main-queue=tdc-main-queue
app.rabbitmq.simulate-failed-queue=${SIMULATE_FAILED_QUEUE:tdc-simulate-failed-queue}

# Unleash feature flags (standard Unleash environment variables)
unleash.api-url=${UNLEASH_API_URL:http://localhost:4242/api}
unleash.api-token=${UNLEASH_API_TOKEN:default:development.unleash-insecure-api-token}
unleash.app-name=${UNLEASH_APP_NAME:rabbitmq-retry}
unleash.instance-id=${UNLEASH_INSTANCE_ID:rabbitmq-retry-1}
unleash.fetch-toggles-interval-seconds=${UNLEASH_FETCH_INTERVAL:10}

# Feature flag names
app.feature-flags.ok-message=ff-ok-message
