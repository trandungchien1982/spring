
server.port = ${APP_PORT:8700}

rabbitmq.queue.name=java_logs_queue
rabbitmq.exchange.name=java_logs_exchange
rabbitmq.routing.key=java_logs_routing_key

# RabbitMQ for LogService configuration
spring.rabbitmq.host=${RABBITMQ_SERVER:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PWD:admin}
spring.rabbitmq.port=${RABBITMQ_PORT:56720}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}